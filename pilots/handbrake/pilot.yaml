# IntentLane HandBrake pilot: what this integration claims, and what proves each claim.
#
# Paths and gate commands resolve from this file's own directory, so the manifest
# is self-contained wherever the repository is checked out. The HandBrake working
# copy is located by the test scripts through HANDBRAKE_DIR.
#
# The claim set is the default one: six claims a command settles, and no claim
# that would need a person. The Siri conversation and the Spotlight result are
# deliberately NOT claimed. To claim one, run:
#
#   intentlane verify --pilot pilots/handbrake/pilot.yaml --claim siri-conversation
#
# which then requires an evidence ledger, because no public API can settle it.
#
# The contract declares one intent, not two. HandBrake's presets view has no search
# field, so system.searchInApp has no in-app list to route into, and this pilot
# does not advertise a surface the application does not have.

version: intentlane-pilot/1.0

contract: contract.yaml
generated: out
metadata: out/metadata/Metadata.appintents

claims:
  - contract
  - generated
  - applicationTests
  - integrationTests
  - metadata
  - indexSync

gates:
  applicationTests: bash tests/run-all-tests.sh
  integrationTests: bash tests/run-integration-tests.sh
  indexSync: bash tests/run-index-tests.sh
