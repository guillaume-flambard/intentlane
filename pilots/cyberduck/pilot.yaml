# IntentLane Cyberduck pilot: what this integration claims, and what proves each claim.
#
# Paths and gate commands resolve from this file's own directory, so the manifest is
# self-contained wherever the repository is checked out. The Cyberduck working copy
# is located by the test scripts through CYBERDUCK_DIR.
#
# The claim set is the default one: six claims a command settles, and no claim that
# would need a person. The Siri conversation and the Spotlight result are deliberately
# NOT claimed. To claim one, run:
#
#   intentlane verify --pilot pilots/cyberduck/pilot.yaml --claim siri-conversation
#
# which then requires an evidence ledger, because no public API can settle it.
#
# The contract declares one intent on one object, a saved connection, identified by
# the UUID its own store writes. There is no subtitle, because the only field that
# could serve as one is the hostname, and a hostname is a client's customers'
# infrastructure. There is also no search intent, because the bookmark list is JavaFX
# and its filter cannot be reached from the native shell.

version: intentlane-pilot/1.0

contract: contract.yaml
generated: out
metadata: out/metadata/Metadata.appintents

claims:
  - contract
  - generated
  - applicationTests
  - integrationTests
  - metadata
  - indexSync

gates:
  applicationTests: bash tests/run-all-tests.sh
  integrationTests: bash tests/run-integration-tests.sh
  indexSync: bash tests/run-index-tests.sh
