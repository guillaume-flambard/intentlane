# IntentLane FSNotes pilot: what this integration claims, and what proves each claim.
#
# Paths and gate commands resolve from this file's own directory, so the manifest
# is self-contained wherever the repository is checked out. The FSNotes working
# copy is located by the test scripts through FSNOTES_DIR.
#
# The claim set is the default one: six claims a command settles, and no claim
# that would need a person. The Siri conversation and the Spotlight result are
# deliberately NOT claimed. To claim one, run:
#
#   intentlane verify --pilot pilots/fsnotes/pilot.yaml --claim siri-conversation
#
# which then requires an evidence ledger, because no public API can settle it.
#
# This pilot is not certified yet. The gates below name the commands that will
# settle each claim once the mapping exists; until stage 5 writes them and stage
# 3 generates the code, verify fails on a missing command rather than on a weak
# claim. That is the intended state of a pilot in progress.

version: intentlane-pilot/1.0

contract: contract.yaml
generated: out
metadata: out/metadata/Metadata.appintents

claims:
  - contract
  - generated
  - applicationTests
  - integrationTests
  - metadata
  - indexSync

gates:
  applicationTests: bash tests/run-all-tests.sh
  integrationTests: bash tests/run-integration-tests.sh
  indexSync: bash tests/run-index-tests.sh
