# IntentLane IINA pilot — live evidence ledger.
#
# This ledger starts unverified on purpose. The automatic gates pass, but no
# person has observed the Siri or Spotlight surfaces yet, and no second tester has
# reproduced anything, so it must not read as verified. `intentlane evidence
# validate` says exactly why, and `intentlane verify --ledger` therefore keeps
# the pilot at awaiting-live-evidence.
#
# To complete the campaign, follow RUNBOOK.md, then replace each `blocked` with
# the observed `pass` or `fail`, record the conditions of the run, and add the
# reproduction block naming the second tester. A `fail` stays a `fail`: the
# ledger is a record, not a scoreboard.

schema: pilot-evidence/1.0
pilot: iina-played-media
platform: macos
revision: bab9c834
conditions:
  osBuild: macOS 27.0 build 26A428
  xcode: Xcode 27.0 build 27A266a
  device: Mac16,12
  locale: fr-FR (AppleLocale en_US@rg=frzzzz)
  appBuild: IINA Debug from the pilot branch, commit bab9c834
  indexName: dev.memolabs.intentlane.iina-pilot.played_media
  fixtures: three synthetic clips generated by fixtures/prepare-fixtures.sh, one named differently from its embedded title
  siriLanguage: TODO a confirmer avant l'observation
  historyRecording: TODO a confirmer avant l'observation

journeys:
  - id: find-played-media
    claimed: [spotlight, siri]
    layers:
      contract: pass
      build: pass
      shortcuts: not-applicable
      spotlight: blocked
      siri: blocked
    risky: false

  - id: open-played-media
    claimed: [siri]
    layers:
      contract: pass
      build: pass
      shortcuts: not-applicable
      siri: blocked
    risky: false

  - id: refuse-unknown-media
    claimed: [siri, spotlight]
    layers:
      contract: pass
      build: pass
      shortcuts: not-applicable
      siri: blocked
      spotlight: blocked
    risky: false

# Nobody has independently reproduced this pilot yet. Naming that state instead of
# omitting the block keeps the validator reporting every missing layer as well, and
# it is not a claim anyone could mistake for a real reproduction.
reproduction:
  by: "none yet"
  status: blocked
