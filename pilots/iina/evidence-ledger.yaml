# IntentLane IINA pilot — live evidence ledger.
#
# This ledger is NOT a release gate any more. The pilot is certified for what a
# command can prove, with no human involved, and its claim set in pilot.yaml does
# not include any observed claim.
#
# This file is the evidence for the optional observed claims, `siri-conversation`
# and `spotlight-ui-result`. It stays unverified until a person observes the
# surfaces and a second tester reproduces them, and it is only read when one of
# those claims is requested:
#
#   intentlane verify --pilot pilots/iina/pilot.yaml --claim siri-conversation --strict
#
# Until then, keep every layer below at `blocked` and the entry says why.

schema: pilot-evidence/1.0
pilot: iina-played-media
platform: macos
