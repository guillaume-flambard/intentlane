# IntentLane IINA pilot: what this integration claims, and what proves each claim.
#
# Paths and gate commands resolve from this file's own directory, so the manifest is
# self-contained wherever the repository is checked out. The IINA working copy is
# located by the test scripts through IINA_DIR.
#
# The claim set below is the default one: five claims a command settles, and no
# claim that would need a person. The Siri conversation and the Spotlight result
# are deliberately NOT claimed here. To claim one, run:
#
#   intentlane verify --pilot pilots/iina/pilot.yaml --claim siri-conversation
#
# which then requires an evidence ledger, because no public API can settle it.

version: intentlane-pilot/1.0

contract: contract.yaml
generated: out
metadata: out/metadata/Metadata.appintents

claims:
  - contract
  - generated
  - applicationTests
  - integrationTests
  - metadata
  - indexSync

gates:
  applicationTests: bash tests/run-all-tests.sh
  integrationTests: bash tests/run-integration-tests.sh
  indexSync: bash tests/run-index-tests.sh

# Optional: the evidence ledger, read only when an observed claim is claimed.
# ledger: evidence-ledger.yaml
#
# Optional: the launch probe, which needs a graphical session, so it is not a
# default claim. Run it with: intentlane verify --pilot ... --probe "<command>"
# probe: bash tests/run-registration-probe.sh
