schema: "0.1"
app:
  id: com.memolabs.intentlane.example
  name: IntentLane Example
  url_scheme: intentlane
  min_ios: "18.0"
  locales: [en, fr]

entities:
  - id: idea
    title:
      en: Idea
      fr: Idée
    identifier: id
    display:
      title: title
      subtitle: status
    query:
      mode: static

intents:
  - id: create_idea
    title:
      en: Create an idea
      fr: Créer une idée
    description:
      en: Add a new idea
      fr: Ajouter une nouvelle idée
    parameters:
      - id: title
        type: string
        required: true
        prompt:
          en: What is the idea?
          fr: Quelle est l'idée ?
      - id: related
        type: entity
        entity: idea
        required: false
        prompt:
          en: Which idea does it relate to?
          fr: À quelle idée cela se rapporte-t-il ?
    execution:
      mode: open_app
      route: /ideas/new
      mapping:
        title: title
        related: related
    risk:
      level: write
      confirmation: optional
      authentication: inherited
    result:
      dialog:
        en: Your idea is ready
        fr: Votre idée est prête
    shortcuts:
      phrases:
        en:
          - Create an idea in ${appName}
        fr:
          - Créer une idée dans ${appName}
