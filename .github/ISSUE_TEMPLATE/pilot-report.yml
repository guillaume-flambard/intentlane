name: Pilot report
description: Run IntentLane on an app you already ship and report where the contract got in the way.
title: "[Pilot] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying IntentLane on a real app. This issue is public. Use a public app or a non-confidential fixture, and remove secrets, proprietary source, client data, usernames, and local filesystem paths.

        Paste only the smallest safe `intentlane.yaml` excerpt, the exact versions, and the relevant lines from `intentlane doctor`.
  - type: input
    id: intentlane-version
    attributes:
      label: IntentLane version
      description: The output of `intentlane --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Expo, React Native and Xcode versions
      description: The relevant lines of your `package.json` and the output of `xcodebuild -version`.
      placeholder: "expo 54.0.37, react-native 0.81.5, Xcode 27.0"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract excerpt
      description: The smallest non-confidential excerpt that reproduces the gap.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What you wanted the app to do
      description: The action or entity you tried to expose to Siri and the Shortcuts app.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What happened
      description: The build result, diagnostic, or behaviour you observed. Reduce generated Swift to a safe minimal fixture.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`intentlane doctor` output"
      description: Only the relevant lines, with usernames and paths removed.
      render: shell
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Any `ILxxxx` diagnostic you hit, and whether its message was actionable.
    validations:
      required: false
  - type: textarea
    id: gaps
    attributes:
      label: What the contract could not express
      description: An intention, a parameter type, or an execution mode you could not declare in schema 0.1, with the YAML that should have worked.
    validations:
      required: false
  - type: textarea
    id: manual
    attributes:
      label: What you had to write by hand
      description: Describe the seam or provide a minimal non-confidential example. Do not paste application-owned source you cannot publish.
    validations:
      required: false
